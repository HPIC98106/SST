# Builds the dashboard shell and publishes it to GitHub Pages.
#
# Only the frontend is deployed here. The Worker is deployed separately with
# `wrangler deploy`, deliberately: it holds every credential, and its release
# should be a decision rather than a side effect of pushing to main.

name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 20 went end-of-life in April 2026. This is the build runtime,
          # separate from the runtime the actions themselves run on.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Not a secret: it is the public address of the Worker, and the Worker
      # returns nothing without the passphrase.
      - run: npm run build
        env:
          # Not a secret: it is the public address of the Worker, and the Worker
          # returns nothing without the passphrase. Unchanged by the move to the
          # HPIC98106 organization — Cloudflare stays on the personal account
          # for now, and this URL is the Intuit OAuth redirect target, so
          # leaving it alone keeps the QuickBooks connection untouched.
          VITE_WORKER_URL: https://hpic-sst.kyhuber-ft.workers.dev

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
